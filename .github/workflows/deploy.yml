name: Deploy to AWS EC2

on:
  push:
    branches:
      - main-group-D-new
      - Group-D-feature/AWS-deployement-ameen # Trigger on push to this branch for testing
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e # Stop script on any error
            BRANCH_NAME="${{ github.ref_name }}"
            REPO_DIR="$HOME/modern-digital-banking-jan-26"
            
            # Setup Swap space to prevent Out Of Memory errors during Docker React Build on 1GB instances
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
            
            echo "Disk space before cleanup:"
            df -h
            
            # Stop the current stack before cleanup so old images and containers can be reclaimed.
            if [ -d "$REPO_DIR" ]; then
              cd "$REPO_DIR"
              docker compose -f docker-compose.prod.yml down || true
              cd "$HOME"
            fi
            
            # Aggressive system cleanup before touching git so the fetch has room to succeed.
            sudo journalctl --vacuum-size=50M || true
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/* || true
            docker image rm modern-digital-banking-jan-26-client:latest modern-digital-banking-jan-26-server:latest || true
            docker system prune -f || true
            docker builder prune -af || true
            docker image prune -f || true
            
            echo "Disk space after cleanup:"
            df -h
            
            # Fresh shallow clone keeps the deployment footprint smaller on low-disk instances.
            rm -rf "$REPO_DIR"
            git clone --depth 1 --branch "$BRANCH_NAME" https://github.com/${{ github.repository }}.git "$REPO_DIR"
            
            cd "$REPO_DIR"
            
            # Export secrets as environment variables before building/running
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
